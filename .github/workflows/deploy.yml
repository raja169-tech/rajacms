name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # If your frontend uses Node/npm (React, Vite, PWA, etc.)
      - name: Install dependencies & Build
        run: |
          cd frontend
          npm ci || npm install
          npm run build || echo "No build script, using raw files"

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Change to 'frontend/dist' or 'frontend/build' if using React/Vite. 
          # Use 'frontend' if it is plain HTML/CSS/JS.
          path: 'frontend/dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
